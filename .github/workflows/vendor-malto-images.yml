name: Vendor MALTO & CO images

on:
  push:
    paths:
      - '.github/workflows/vendor-malto-images.yml'

permissions:
  contents: write

jobs:
  vendor-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download selected public MALTO & CO photos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/images
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36'

          curl -fL --retry 3 -A "$UA" 'https://spiritogiusto.it/media/k2/items/cache/7539a1b30386b8951ffea14c91e802dc_L.jpg' -o assets/images/malto-bar.jpg
          curl -fL --retry 3 -A "$UA" 'https://dynamic-media-cdn.tripadvisor.com/media/photo-o/0d/d1/b2/ca/ottimi-panini-con-tipologie.jpg?h=900&s=1&w=1200' -o assets/images/malto-burger.jpg
          curl -fL --retry 3 -A "$UA" 'https://dynamic-media-cdn.tripadvisor.com/media/photo-o/0c/68/d2/47/degustazione-di-birre.jpg?h=900&s=1&w=1200' -o assets/images/malto-beer-tasting.jpg
          curl -fL --retry 3 -A "$UA" 'https://img02.restaurantguru.com/cdea-Pub-and-bar-Malto-and-Co-interior.jpg' -o assets/images/malto-interior.jpg
          curl -fL --retry 3 -A "$UA" 'https://img02.restaurantguru.com/c649-Pub-and-bar-Malto-and-Co-facade.jpg' -o assets/images/malto-exterior.jpg
          curl -fL --retry 3 -A "$UA" 'https://img02.restaurantguru.com/c8c4-Pub-and-bar-Malto-and-Co-food.jpg' -o assets/images/malto-food.jpg

          file assets/images/*
          test $(find assets/images -type f -size +15k | wc -l) -eq 6

      - name: Replace remote image URLs with local assets
        shell: python
        run: |
          from pathlib import Path
          import re

          replacements = {
              'https://spiritogiusto.it/media/k2/items/cache/7539a1b30386b8951ffea14c91e802dc_L.jpg': 'assets/images/malto-bar.jpg',
              'https://dynamic-media-cdn.tripadvisor.com/media/photo-o/0d/d1/b2/ca/ottimi-panini-con-tipologie.jpg?h=900&s=1&w=1200': 'assets/images/malto-burger.jpg',
              'https://dynamic-media-cdn.tripadvisor.com/media/photo-o/0c/68/d2/47/degustazione-di-birre.jpg?h=900&s=1&w=1200': 'assets/images/malto-beer-tasting.jpg',
              'https://dynamic-media-cdn.tripadvisor.com/media/photo-o/0c/68/d2/47/degustazione-di-birre.jpg?h=900&s=1&w=1000': 'assets/images/malto-beer-tasting.jpg',
              'https://img02.restaurantguru.com/cdea-Pub-and-bar-Malto-and-Co-interior.jpg': 'assets/images/malto-interior.jpg',
              'https://img02.restaurantguru.com/c649-Pub-and-bar-Malto-and-Co-facade.jpg': 'assets/images/malto-exterior.jpg',
              'https://img02.restaurantguru.com/c8c4-Pub-and-bar-Malto-and-Co-food.jpg': 'assets/images/malto-food.jpg',
          }

          for filename in ('index.html', 'styles.css'):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if filename == 'index.html':
                  text = re.sub(r'\s+referrerpolicy="no-referrer"', '', text)
                  text = re.sub(r'\s+onerror="[^"]*"', '', text)
              path.write_text(text, encoding='utf-8')

          # Guardrail: no third-party MALTO image hosts remain.
          combined = Path('index.html').read_text(encoding='utf-8') + Path('styles.css').read_text(encoding='utf-8')
          for host in ('spiritogiusto.it/media/', 'dynamic-media-cdn.tripadvisor.com/media/', 'img02.restaurantguru.com/'):
              if host in combined:
                  raise SystemExit(f'Remote image reference still present: {host}')

      - name: Commit local images and updated references
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images index.html styles.css
          git commit -m 'Store MALTO photos locally and use local assets'
          git push
